# Template for an India-resident investor (e.g. Dad). Copy to profiles/<name>.yaml
# or run:  python -m dicfo onboard --name dad
name: Dad
age: 55
residency: India
tax_residency: India
citizenship: India
employment: salaried            # salaried | business | retired
monthly_income: 150000
base_currency: INR
spend_currency: INR
horizon_years: 10
risk_tolerance: moderate
emergency_fund_months: 6
emergency_fund_have_months: 6
monthly_investable: 50000
tax:
  regime: new                   # new | old  (80C/ELSS only help under the old regime)
  india_slab: 0.30
holdings:
  mutual_funds:
    - {scheme_code: "122639", name: "Parag Parikh Flexi Cap Fund - Direct Growth", value: 500000, sip_monthly: 10000, plan: direct, category: flexi_cap}
    - {scheme_code: "120716", name: "UTI Nifty 50 Index Fund - Direct Growth", value: 300000, sip_monthly: 10000, plan: direct, category: index_largecap}
  other:
    india_equity: 200000        # direct stocks
    gold: 150000
    india_fixed_income: 1200000 # EPF + PPF + FDs
    us_equity: 0

# What to buy every month (core) and what to buy only on dips (opportunistic).
plan:
  core:                         # bought every month regardless of price
    - {symbol: "120716", type: mf, name: "UTI Nifty 50 Index Fund", monthly: 10000}
    - {symbol: "122639", type: mf, name: "Parag Parikh Flexi Cap", monthly: 10000}
    - {symbol: HDFCBANK.NS, type: stock, name: "HDFC Bank", monthly: 5000}
    - {symbol: GOLDBEES.NS, type: etf, name: "Gold ETF", monthly: 5000, asset_class: gold}
  opportunistic:                # bought in tranches only when price falls this far from its 52-week high
    - {symbol: RELIANCE.NS, name: "Reliance", budget: 60000, buy_below_pct: -12, tranches: 3, since: "2026-11-01"}
    - {symbol: TCS.NS, name: "TCS", budget: 60000, buy_below_pct: -15, tranches: 3, since: "2026-11-01"}
    - {symbol: GOOGL, name: "Alphabet (via LRS)", budget: 50000, buy_below_pct: -10, tranches: 3, since: "2026-11-01"}
  opportunistic_monthly_reserve: 10000   # parked in a liquid fund until a trigger hits
